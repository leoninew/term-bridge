root = "."
tmp_dir = "bin/air/agent"

[build]
cmd = "go build -o bin/air/agent/termbridge.exe ./cmd/termbridge"
entrypoint = "bin/air/agent/termbridge.exe"
args_bin = ["agent"]
include_ext = ["go", "yaml", "yml", "toml"]
exclude_dir = [".git", ".termbridge", "bin", "data", "docs", "logs", "vendor", "web"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
kill_delay = "500ms"
log = "air-agent-build.log"
poll = false
poll_interval = 500
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = true
time = true

[misc]
clean_on_exit = true
