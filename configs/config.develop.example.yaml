# TermBridge-go 本地开发联调配置示例
#
# 用法：复制为 configs/config.develop.yaml，并通过 OS env 设置 TERMBRIDGE_ENV=develop。
# 注意：/agent-api 与 /cloud-api 只用于 Vite dev proxy，不是最终产品 API path。

agent:
  listen_url: http://127.0.0.1:9031
  static_dir: ""
  public_url: http://localhost:9030
  api_base_url: /agent-api
  cors_allowed_origins: []
  expose_errors: false

cloud:
  listen_url: http://127.0.0.1:9032
  static_dir: ""
  public_url: http://localhost:9030
  api_base_url: /cloud-api
  cors_allowed_origins: []
  expose_errors: false
  oauth:
    redirect_url: http://localhost:9030/cloud/oauth/callback
