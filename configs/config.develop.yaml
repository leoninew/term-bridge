# TermBridge-go 开发环境配置
#
# 由 TERMBRIDGE_ENV=develop 启用，task run / task agent / task cloud 使用该环境。
# 开发模式下浏览器入口是 Vite dev server http://localhost:9030，后端分别监听 9031/9032，
# 前端通过 /agent-api 和 /cloud-api 代理到对应后端。

jwt:
  secret_key: 3IPplKPbL4wUi9j8k_1eon0IBoxKwctci66YY_jEFIc=

agent:
  # Agent 后端开发端口；Vite 将 /agent-api 代理到这里。
  listen_url: http://127.0.0.1:9031
  # 浏览器访问 Agent 前端的公开地址，也是 Agent OAuth callback 的同源地址。
  public_url: http://localhost:9030
  # 注入给前端的 Agent API base；开发环境使用 Vite proxy path。
  api_base_url: /agent-api
  # 允许 Vite dev server 访问 Agent API / WebSocket。
  cors_allowed_origins:
    - http://localhost:9030
  # 开发环境暴露错误细节，便于定位配置和接口问题。
  expose_errors: true
  # Agent 作为 Cloud OAuth2 client 的配置。
  # client_secret 只供 Agent 后端换 token 使用，不能写入前端 web/.env.development。
  oauth:
    client_id: termbridge-agent
    client_secret: agent-secret
    redirect_url: http://localhost:9030/agent/oauth/callback
    scopes: [openid, email, profile]

cloud:
  # Cloud 后端开发端口；Vite 将 /cloud-api 代理到这里。
  listen_url: http://127.0.0.1:9032
  # Cloud 对浏览器和 Agent 暴露的开发环境公开地址。
  public_url: http://localhost:9030
  # 注入给前端的 Cloud API base；开发环境使用 Vite proxy path。
  api_base_url: /cloud-api
  # 开发环境暴露错误细节，便于定位 OAuth、设备和隧道问题。
  expose_errors: true
  # 允许 Vite dev server 访问 Cloud API / 终端 WebSocket。
  # 终端 WebSocket 的 Origin 是 http://localhost:9030，而 Cloud 实际监听 127.0.0.1:9032，
  # 因此这里必须显式放行，否则 /cloud-api/devices/.../sessions/.../ws 会在握手阶段返回 403。
  cors_allowed_origins:
    - http://localhost:9030
  # Cloud 作为 OAuth2 Authorization Server 的开发 client registry。
  # 这里的 client_secret 用于校验 Agent 后端 token exchange，不会暴露给浏览器。
  oauth:
    clients:
      - client_id: termbridge-agent
        client_secret: agent-secret
        redirect_url: http://localhost:9030/agent/oauth/callback
        scopes: [openid, email, profile]

auth:
  # Google OAuth2 只用于 Cloud 账号登录；redirect_url 是前端 SPA callback 页面，
  # 页面收到 code/state 后再调用 /cloud-api/auth/google/callback 完成后端登录。
  google:
    client_id: 532163805256-n30lfmafaqdn54oqlj73dj438hm37ac4.apps.googleusercontent.com
    client_secret: REDACTED_GOOGLE_OAUTH_CLIENT_SECRET
    redirect_url: http://localhost:9030/auth/google/callback
