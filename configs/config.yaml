# TermBridge-go 默认配置
#
# 这是只读 baseline，提交到版本库；业务运行中变化的配置不要写回此文件。
# 默认配置优先级：configs/config.yaml < .env < OS env。
# 设置 TERMBRIDGE_ENV=<env> 后，优先级为：
# configs/config.yaml < configs/config.<env>.yaml < .env.<env> < OS env。
# TERMBRIDGE_ENV 只从 OS env 读取，不从 .env / .env.<env> 读取。

# JWT 认证密钥（必填）。必须是 base64 编码的 32 字节随机 key，普通明文 secret 会被拒绝。
# python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
jwt:
  secret_key: ""

# 日志
log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096
    skip_asset_enabled: true
    skip_asset_extensions:
      - .js
      - .mjs
      - .css
      - .map
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .svg
      - .ico
      - .webp
      - .avif
      - .woff
      - .woff2
      - .ttf
      - .otf
      - .eot
      - .wasm

# 历史记录
history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

# Web Terminal 输出、回放与单客户端背压配置。
# history 控制持久化容量；terminal.replay 只控制 attach 时回放的最近历史。
terminal:
  replay:
    max_bytes: 1048576
    chunk_bytes: 65536
  client:
    queue:
      max_messages: 64
      max_bytes: 4194304

# Runtime 状态目录
runtime:
  state_dir: data

# Agent HTTP/API server 配置。
# baseline 面向最终本机运行：agent 自己提供同源 Web/API，不依赖 Vite dev proxy。
local:
  # termbridge agent 暴露的本机 Web/API 地址。
  listen_url: http://127.0.0.1:9030
  # Web 静态资源目录；为空时只提供 API，打包或部署场景可指向已构建前端目录。
  static_dir: ""
  # 浏览器访问本地前端/setup 的地址，用于本地工作台与云端授权回跳。
  public_url: http://localhost:9030
  # 跨域 API Origin allowlist；空列表表示不开放跨域。
  # 终端 WebSocket 也会使用该列表校验浏览器 Origin；同源访问不需要配置。
  cors_allowed_origins: []
  # 是否在 agent API 错误响应中暴露内部错误细节。
  # 仅建议本地调试打开；生产保持 false。
  expose_errors: false

  # Agent 作为 OAuth2 client 接入 Cloud。client_secret 只给 Agent 后端使用，不注入浏览器运行时配置。
  # 默认值面向本地开发；其他环境通过 configs/config.<env>.yaml 或环境变量覆盖。
  oauth:
    client_id: termbridge-agent
    client_secret: agent-secret
    redirect_url: http://localhost:9030/oauth/callback
    scopes: [openid, email, profile]

  # Agent 独立数据库，与 cloud 分离，避免 migration 校验误报部分表存在。
  database:
    driver: sqlite
    sqlite:
      path: data/agent.db
    mysql:
      dsn: ""

# Cloud HTTP/API server 与 connection 配置。
# baseline 面向云端同源部署：cloud 自己提供同源 Web/API，不使用本地 Vite proxy path。
cloud:
  # termbridge cloud 暴露的云端 Web/API 地址。
  listen_url: http://127.0.0.1:9030
  # Web 静态资源目录；为空时只提供 API，部署场景可指向已构建前端目录。
  static_dir: ""
  # Cloud 对外访问地址。Agent 连接云端和云端 OAuth/API 入口使用该地址。
  public_url: ""
  # 跨域 API Origin allowlist；空列表表示不开放跨域。
  # 终端 WebSocket 也会使用该列表校验浏览器 Origin；同源访问不需要配置。
  cors_allowed_origins: []
  # 是否在 cloud API 错误响应中暴露内部错误细节。
  # 仅建议本地调试打开；生产保持 false。
  expose_errors: false

  # Cloudflare Turnstile protects public email/password login and registration.
  # Production must supply non-empty credentials and a public HTTPS hostname via environment-specific configuration.
  turnstile:
    site_key: ""
    secret_key: ""

  # Cloud 作为 OAuth2 Authorization Server 时接受的 client registry。
  # 默认值面向本地开发；其他环境通过 configs/config.<env>.yaml 或环境变量覆盖。
  oauth:
    clients:
      - client_id: termbridge-agent
        client_secret: agent-secret
        redirect_url: http://localhost:9030/oauth/callback
        scopes: [openid, email, profile]

  # Cloud 独立数据库，与 agent 分离，避免 migration 校验误报部分表存在。
  database:
    driver: sqlite
    sqlite:
      path: data/cloud.db
    mysql:
      dsn: ""

# Auth
auth:
  jwt_ttl: 24h
  local_admin:
    username: admin
    password: admin
  password:
    min_length: 8
    max_length: 128
  code:
    length: 6
    ttl: 2m
    resend_cooldown: 1m
    max_attempts: 3
  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""

# Resend
resend:
  api_key: ""
  from_email: ""
