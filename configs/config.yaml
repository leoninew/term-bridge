# TermBridge-go 默认配置
#
# 这是只读 baseline，提交到版本库；业务运行中变化的配置不要写回此文件。
# 默认配置优先级：configs/config.yaml < .env < OS env。
# 设置 TERMBRIDGE_ENV=<env> 后，优先级为：
# configs/config.yaml < configs/config.<env>.yaml < .env.<env> < OS env。
# TERMBRIDGE_ENV 只从 OS env 读取，不从 .env / .env.<env> 读取。

# JWT 认证密钥（必填）。必须是 base64 编码的 32 字节随机 key，普通明文 secret 会被拒绝。
# 生成方式：openssl rand -base64 32
jwt:
  secret_key: ""

# 日志
log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096

# 历史记录
history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

# Runtime 状态目录
runtime:
  state_dir: .termbridge

# Web 前端配置。
web:
  # Web runtime mode: local 为本机 Agent 控制台；cloud 为云端 Gate 门户。
  mode: local
  # Web 静态资源目录；为空时只提供 API，便于本地 Vite 开发。
  static_dir: ""

# Gate API 行为配置
gate:
  browser:
    # 允许访问 Gate API 的浏览器前端 Origin。
    # 本地开发默认允许 Vite dev server；生产部署时应改为实际 Web origin。
    allowed_origins:
      - http://127.0.0.1:9031
      - http://localhost:9031
  api:
    # 是否在 API 错误响应中暴露内部错误细节。
    # 仅建议本地调试打开；生产保持 false。
    expose_errors: false

# 本机 Agent / serve 配置
agent:
  # 本机 termbridge serve 暴露的后端 API 地址。
  # agent.connect_url 留空时会默认等于此地址，用于本机 self-tunnel。
  listen_url: http://127.0.0.1:9030

  # 浏览器访问本机 Agent 前端的地址，用于 local dashboard 与云端授权回跳。
  # 本地开发指向 Vite dev server；内置静态资源部署时指向浏览器访问该 Agent 的地址。
  # 该字段不表达云端 Gate 的公网发布地址。
  public_url: http://localhost:9031

  # 本机 self-tunnel 目标地址；为空表示使用 agent.listen_url。
  # 云端连接目标集中配置在 cloud.gate_url，不通过 agent.connect_url 切换。
  connect_url: ""

  # 当前设备 ID。通常保持为空，由 termbridge serve 首次启动时自动生成并写入生效的 .env / .env.<env>。
  device_id: ""

  # 当前设备显示名。为空时使用本机 hostname 自动生成；可手动设置为更友好的名称。
  device_name: ""

# Cloud connection 配置
cloud:
  # 固定 Cloud Gate 的外部访问地址。
  # 本地 /cloud/oauth/start 会按 OAuth2 client 配置跳转到该地址完成云端账号授权。
  gate_url: "http://termbridge.lvh.me"

  # TermBridge Cloud OAuth2 client 配置。local mode 作为 Cloud Gate 的 OAuth2 client，
  # redirect_url 指向本机 /cloud/oauth/callback。
  oauth:
    client_id: termbridge-local
    client_secret: ""
    redirect_url: http://localhost:9031/cloud/oauth/callback
    scopes:
      - openid
      - email
      - profile

# Database
database:
  driver: sqlite
  sqlite:
    path: .termbridge/termbridge.db
  mysql:
    dsn: ""

# Auth
auth:
  jwt_ttl: 24h
  local_admin:
    username: admin
    password: admin
  password:
    min_length: 8
    max_length: 128
  code:
    length: 6
    ttl: 2m
    resend_cooldown: 1m
    max_attempts: 3
  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""

# Resend
resend:
  api_key: ""
  from_email: ""
