# TermBridge-go 默认配置
#
# 这是只读 baseline，提交到版本库；业务运行中变化的配置不要写回此文件。
# 默认配置优先级：configs/config.yaml < .env < OS env。
# 设置 TERMBRIDGE_ENV=<env> 后，优先级为：
# configs/config.yaml < configs/config.<env>.yaml < .env.<env> < OS env。
# TERMBRIDGE_ENV 只从 OS env 读取，不从 .env / .env.<env> 读取。

# JWT 认证密钥（必填）。必须是 base64 编码的 32 字节随机 key，普通明文 secret 会被拒绝。
# python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
jwt:
  secret_key: ""

# 日志
log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096

# 历史记录
history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

# Runtime 状态目录
runtime:
  state_dir: .termbridge

# 当前进程 HTTP/API server 配置
server:
  # Web/runtime mode: local 为本机控制台；cloud 为云端门户。
  mode: local
  # termbridge serve 暴露的后端 API 地址。
  listen_url: http://127.0.0.1:9030
  # Web 静态资源目录；为空时只提供 API，便于本地 Vite 开发。
  static_dir: ""
  # 浏览器访问当前 server 前端/setup 的地址，用于 local dashboard 与云端授权回跳。
  public_url: http://localhost:9031
  # 前端运行时 API base URL；空值表示同源 /api。
  api_base_url: ""
  # 跨域 API Origin allowlist；空列表表示不开放跨域。
  cors_allowed_origins: []

# Gate API 行为配置
gate:
  api:
    # 是否在 API 错误响应中暴露内部错误细节。
    # 仅建议本地调试打开；生产保持 false。
    expose_errors: false

# Cloud connection 配置
cloud:
  # 固定 Cloud Gate 的外部访问地址。
  # 本地 /cloud/oauth/start 会按 OAuth2 client 配置跳转到该地址完成云端账号授权。
  gate_url: ""

  # TermBridge Cloud OAuth2 client 配置。local mode 作为 Cloud Gate 的 OAuth2 client，
  # redirect_url 指向本机 /cloud/oauth/callback。
  oauth:
    client_id: termbridge-local
    client_secret: ""
    redirect_url: http://localhost:9031/cloud/oauth/callback
    scopes:
      - openid
      - email
      - profile

# Database
database:
  driver: sqlite
  sqlite:
    path: .termbridge/termbridge.db
  mysql:
    dsn: ""

# Auth
auth:
  jwt_ttl: 24h
  local_admin:
    username: admin
    password: admin
  password:
    min_length: 8
    max_length: 128
  code:
    length: 6
    ttl: 2m
    resend_cooldown: 1m
    max_attempts: 3
  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""

# Resend
resend:
  api_key: ""
  from_email: ""
