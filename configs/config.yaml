# TermBridge-go 默认配置
#
# 这是只读 baseline，提交到版本库；业务运行中变化的配置不要写回此文件。
# 默认配置优先级：configs/config.yaml < .env < OS env。
# 设置 TERMBRIDGE_ENV=<env> 后，优先级为：
# configs/config.yaml < configs/config.<env>.yaml < .env.<env> < OS env。
# TERMBRIDGE_ENV 只从 OS env 读取，不从 .env / .env.<env> 读取。

# JWT 认证密钥（必填）。必须是 base64 编码的 32 字节随机 key，普通明文 secret 会被拒绝。
# python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
jwt:
  secret_key: ""

# 日志
log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096

# 历史记录
history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

# Runtime 状态目录
runtime:
  state_dir: .termbridge

# Agent HTTP/API server 配置。
# baseline 面向最终本机运行：agent 自己提供 Web/API，同源 /api，不依赖 Vite dev proxy。
agent:
  # termbridge agent 暴露的本机 Web/API 地址。
  listen_url: http://127.0.0.1:9030
  # Web 静态资源目录；为空时只提供 API，打包或部署场景可指向已构建前端目录。
  static_dir: ""
  # 浏览器访问 agent 前端/setup 的地址，用于 local dashboard 与云端授权回跳。
  public_url: http://localhost:9030
  # 前端运行时 API base URL；空值表示同源 /api。
  api_base_url: ""
  # 跨域 API Origin allowlist；空列表表示不开放跨域。
  cors_allowed_origins: []
  # 是否在 agent API 错误响应中暴露内部错误细节。
  # 仅建议本地调试打开；生产保持 false。
  expose_errors: false
  # Agent 独立数据库，与 cloud 分离，避免 migration 校验误报部分表存在。
  database:
    driver: sqlite
    sqlite:
      path: .termbridge/agent.db
    mysql:
      dsn: ""

# Cloud HTTP/API server 与 connection 配置。
# baseline 面向云端同源部署：cloud 自己提供 Web/API，同源 /api，不使用本地 Vite proxy path。
cloud:
  # termbridge cloud 暴露的云端 Web/API 地址。
  listen_url: http://127.0.0.1:9030
  # Web 静态资源目录；为空时只提供 API，部署场景可指向已构建前端目录。
  static_dir: ""
  # 浏览器访问 cloud 前端的地址。
  public_url: http://localhost:9030
  # 前端运行时 API base URL；空值表示同源 /api。
  api_base_url: ""
  # 跨域 API Origin allowlist；空列表表示不开放跨域。
  cors_allowed_origins: []
  # 是否在 cloud API 错误响应中暴露内部错误细节。
  # 仅建议本地调试打开；生产保持 false。
  expose_errors: false
  # 固定 Cloud Gate 的外部访问地址。
  # 本地 /cloud/oauth/start 会按 OAuth2 client 配置跳转到该地址完成云端账号授权。
  gate_url: ""

  # TermBridge Cloud OAuth2 client 配置。local mode 作为 Cloud Gate 的 OAuth2 client，
  # redirect_url 指向本机 /cloud/oauth/callback。
  oauth:
    client_id: termbridge-local
    client_secret: ""
    redirect_url: http://localhost:9030/cloud/oauth/callback
    scopes:
      - openid
      - email
      - profile

  # Cloud 独立数据库，与 agent 分离，避免 migration 校验误报部分表存在。
  database:
    driver: sqlite
    sqlite:
      path: .termbridge/cloud.db
    mysql:
      dsn: ""

# Auth
auth:
  jwt_ttl: 24h
  local_admin:
    username: admin
    password: admin
  password:
    min_length: 8
    max_length: 128
  code:
    length: 6
    ttl: 2m
    resend_cooldown: 1m
    max_attempts: 3
  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""

# Resend
resend:
  api_key: ""
  from_email: ""
