version: '3'

silent: false

vars:
  BUILD_VERSION:
    sh: sh ./scripts/build-version.sh
  BUILD_COMMIT:
    sh: 'git rev-parse --short=12 HEAD'
  BUILD_TIME:
    sh: 'if [ -n "$TERMBRIDGE_BUILD_TIME" ]; then printf "%s" "$TERMBRIDGE_BUILD_TIME"; else date -u +%Y%m%d-%H%M%S; fi'
  GO_LDFLAGS: >-
    -X gitee.com/leoninew/TermBridge-go/internal/shared/common/utils/version.Version={{.BUILD_VERSION}}
    -X gitee.com/leoninew/TermBridge-go/internal/shared/common/utils/version.Commit={{.BUILD_COMMIT}}
    -X gitee.com/leoninew/TermBridge-go/internal/shared/common/utils/version.BuildTime={{.BUILD_TIME}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install web and Go dependencies, plus proto tooling into ./bin
    env:
      GOBIN: '{{.TASKFILE_DIR}}/bin'
      PATH: '{{.TASKFILE_DIR}}/bin:${PATH}'
    cmds:
      - mkdir -p bin
      - go install github.com/bufbuild/buf/cmd/buf@v1.65.0
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - cd web && yarn install
      - go mod download
      - go mod tidy

  proto:
    desc: Generate Go and frontend TypeScript code from proto files via buf
    cmds:
      - ./bin/buf dep update
      - ./bin/buf generate --template buf.gen.yaml
      - cd web && ../bin/buf generate --template buf.gen.yaml

  check:
    desc: Run frontend and backend checks
    cmds:
      - yarn --cwd web typecheck
      - yarn --cwd web lint:fix
      - yarn --cwd web format:fix
      - ./bin/golangci-lint fmt ./cmd/... ./internal/...
      - ./bin/golangci-lint run ./cmd/... ./internal/...

  test:
    desc: Run frontend and backend unit tests
    cmds:
      - sh scripts/build-version_test.sh
      - cd web && yarn test
      - go test ./cmd/... ./internal/...

  web:
    desc: Start web frontend on localhost:9030
    dir: web
    cmds:
      - yarn dev

  agent:
    desc: Run database migrations and start local agent server with Air
    env:
      TERMBRIDGE_ENV: development
    cmds:
      - go run cmd/termbridge/main.go migrate agent
      - air -c .air.agent.toml -- {{.CLI_ARGS}}

  cloud:
    desc: Run database migrations and start cloud backend with Air
    env:
      TERMBRIDGE_ENV: development
    cmds:
      - go run cmd/termbridge/main.go migrate cloud
      - air -c .air.cloud.toml -- {{.CLI_ARGS}}

  exec:
    desc: Run local command through termbridge exec
    cmds:
      - go run cmd/termbridge/main.go exec -- {{.CLI_ARGS}}

  run:
    desc: Start web, agent, and cloud development servers together
    env:
      TERMBRIDGE_ENV: development
    cmds:
      - uv run python scripts/run.py

  build:
    desc: Build web frontend and termbridge image
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags "{{.GO_LDFLAGS}}" -o bin/termbridge ./cmd/termbridge

  docker:
    desc: Build web frontend and termbridge image
    cmds:
      - docker build -f Dockerfile.cn -t termbridge --build-arg VERSION={{.BUILD_VERSION}} --build-arg COMMIT={{.BUILD_COMMIT}} --build-arg BUILD_TIME={{.BUILD_TIME}} .

  package:
    desc: Build Windows, Linux, and macOS x64 portable zip packages
    vars:
      WINDOWS_ROOT: bin/package/windows/TermBridge
      LINUX_ROOT: bin/package/linux/TermBridge
      MACOS_ROOT: bin/package/macos/TermBridge
    cmds:
      - rm -rf bin/package bin/TermBridge-windows-x64.zip bin/TermBridge-linux-x64.zip bin/TermBridge-macos-x64.zip
      - mkdir -p {{.WINDOWS_ROOT}}/web {{.WINDOWS_ROOT}}/configs {{.LINUX_ROOT}}/web {{.LINUX_ROOT}}/configs {{.MACOS_ROOT}}/web {{.MACOS_ROOT}}/configs
      - cd web && yarn build
      - env GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "{{.GO_LDFLAGS}}" -o {{.WINDOWS_ROOT}}/termbridge.exe ./cmd/termbridge
      - env GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "{{.GO_LDFLAGS}}" -o {{.LINUX_ROOT}}/termbridge ./cmd/termbridge
      - env GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "{{.GO_LDFLAGS}}" -o {{.MACOS_ROOT}}/termbridge ./cmd/termbridge
      - cp -R web/dist/. {{.WINDOWS_ROOT}}/web/
      - cp -R web/dist/. {{.LINUX_ROOT}}/web/
      - cp -R web/dist/. {{.MACOS_ROOT}}/web/
      - cp configs/config.yaml {{.WINDOWS_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.LINUX_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.MACOS_ROOT}}/configs/config.yaml
      - cp scripts/package/.env.prod scripts/package/.env.test {{.WINDOWS_ROOT}}/
      - cp scripts/package/.env.prod scripts/package/.env.test {{.LINUX_ROOT}}/
      - cp scripts/package/.env.prod scripts/package/.env.test {{.MACOS_ROOT}}/
      - cp scripts/package/start.cmd {{.WINDOWS_ROOT}}/start.cmd
      - cp scripts/package/start.sh {{.WINDOWS_ROOT}}/start.sh
      - cp scripts/package/start.sh {{.LINUX_ROOT}}/start.sh
      - cp scripts/package/start.sh {{.MACOS_ROOT}}/start.sh
      - chmod +x {{.LINUX_ROOT}}/termbridge {{.LINUX_ROOT}}/start.sh {{.MACOS_ROOT}}/termbridge {{.MACOS_ROOT}}/start.sh
      - cd bin/package/windows && zip -r ../../TermBridge-windows-x64.zip TermBridge
      - cd bin/package/linux && zip -r ../../TermBridge-linux-x64.zip TermBridge
      - cd bin/package/macos && zip -r ../../TermBridge-macos-x64.zip TermBridge

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf web/dist bin
      - rm -rf data/agent.db*
      - rm -rf data/cloud.db*
      - rm -rf data/history
