version: '3'

# This Taskfile requires a POSIX-compatible shell (Cygwin, Git Bash, or MSYS2)
# for shell variables, mkdir -p, and release packaging commands.
vars:
  VERSION:
    sh: cat VERSION
  BUF_VERSION: v1.65.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  GOLANGCI_LINT_VERSION: v2.12.2
  AIR_VERSION: v1.66.0
  GOLANGCI_LINT_TIMEOUT: 5m
  GO_CHECK_PACKAGES: ./cmd/... ./internal/... ./migrations/...
  GO_TEST_PACKAGES: ./cmd/... ./internal/... ./migrations/...
  FIX_ENABLED: '{{if contains "--fix" .CLI_ARGS}}1{{end}}'
  COVER_ENABLED: '{{if contains "--cov" .CLI_ARGS}}1{{end}}'
  FIX_FORMAT_ARGS: '{{if eq .FIX_ENABLED "1"}}{{else}}--diff{{end}}'
  FIX_LINT_ARGS: '{{if eq .FIX_ENABLED "1"}}--fix{{end}}'
  COVER_ARGS: '{{if eq .COVER_ENABLED "1"}}-cover -coverprofile=coverage.out{{end}}'
  WEB_LINT_TASK: '{{if eq .FIX_ENABLED "1"}}lint:fix{{else}}lint{{end}}'
  WEB_FORMAT_TASK: '{{if eq .FIX_ENABLED "1"}}format:fix{{else}}format{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  version:
    desc: Calculate the release version from Git history
    cmds:
      - python scripts/version-calc.py

  version:apply:
    desc: Calculate and apply the release version to tracked metadata
    cmds:
      - python scripts/version-calc.py --quiet --apply

  deps:
    desc: Download dependencies and install pinned tools into ./bin
    env:
      GOBIN: '{{.TASKFILE_DIR}}/bin'
      GOTOOLCHAIN: local
    cmds:
      - mkdir -p bin
      - go mod download
      - cd web && yarn install --frozen-lockfile
      - go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/air-verse/air@{{.AIR_VERSION}}

  install:
    desc: Install the termbridge CLI for user-level use
    cmds:
      - go install ./cmd/termbridge

  proto:deps:
    desc: Update Buf module dependencies
    cmds:
      - ./bin/buf dep update

  proto:
    desc: Generate Go and frontend TypeScript code from proto files via ./bin/buf
    cmds:
      - ./bin/buf generate --template buf.gen.yaml
      - cd web && ../bin/buf generate --template buf.gen.yaml

  check:
    desc: Check frontend and Go format, lint, and static analysis; use -- --fix to apply fixes
    env:
      GOPROXY: off
      GOSUMDB: off
    cmds:
      - yarn --cwd web {{.WEB_LINT_TASK}}
      - yarn --cwd web {{.WEB_FORMAT_TASK}}
      - yarn --cwd web typecheck
      - ./bin/golangci-lint config verify
      - ./bin/golangci-lint fmt {{.FIX_FORMAT_ARGS}} {{.GO_CHECK_PACKAGES}}
      - ./bin/golangci-lint run --modules-download-mode=readonly --timeout {{.GOLANGCI_LINT_TIMEOUT}} {{.FIX_LINT_ARGS}} {{.GO_CHECK_PACKAGES}}

  test:
    desc: Run frontend and Go unit tests; use -- --cov to collect Go coverage
    env:
      GOPROXY: off
      GOSUMDB: off
    cmds:
      - cd web && yarn test
      - go test {{.COVER_ARGS}} {{.GO_TEST_PACKAGES}}

  dev:web:
    desc: Start web frontend on localhost:9030
    dir: web
    cmds:
      - yarn dev

  dev:agent:
    desc: Run database migrations and start local agent server with Air
    env:
      TERMBRIDGE_ENV: development
    cmds:
      - go run cmd/termbridge/main.go migrate agent
      - ./bin/air -c .air.agent.toml -- {{.CLI_ARGS}}

  dev:cloud:
    desc: Run database migrations and start cloud backend with Air
    env:
      TERMBRIDGE_ENV: development
    cmds:
      - go run cmd/termbridge/main.go migrate cloud
      - ./bin/air -c .air.cloud.toml -- {{.CLI_ARGS}}

  exec:
    desc: Run local command through termbridge exec
    cmds:
      - go run cmd/termbridge/main.go exec -- {{.CLI_ARGS}}

  build:
    desc: Build the termbridge binary
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/termbridge ./cmd/termbridge
  docker:
    desc: Build the termbridge Docker image
    cmds:
      - docker build -f Dockerfile.cn -t termbridge .
  release:
    desc: Build Windows, Linux, and macOS x64 portable release packages
    env:
      CGO_ENABLED: '0'
    vars:
      WINDOWS_ROOT: 'dist/package/termbridge-v{{.VERSION}}-windows-x64'
      LINUX_ROOT: 'dist/package/termbridge-v{{.VERSION}}-linux-x64'
      MACOS_ROOT: 'dist/package/termbridge-v{{.VERSION}}-macos-x64'
    cmds:
      - rm -rf {{.WINDOWS_ROOT}} {{.LINUX_ROOT}} {{.MACOS_ROOT}} "dist/termbridge-v{{.VERSION}}-windows-x64.zip" "dist/termbridge-v{{.VERSION}}-linux-x64.zip" "dist/termbridge-v{{.VERSION}}-macos-x64.zip"
      - mkdir -p {{.WINDOWS_ROOT}}/web {{.WINDOWS_ROOT}}/configs {{.LINUX_ROOT}}/web {{.LINUX_ROOT}}/configs {{.MACOS_ROOT}}/web {{.MACOS_ROOT}}/configs
      - cd web && yarn build
      - cmd: go build -trimpath -o {{.WINDOWS_ROOT}}/termbridge.exe ./cmd/termbridge
        env:
          GOOS: windows
          GOARCH: amd64
      - cmd: go build -trimpath -o {{.LINUX_ROOT}}/termbridge ./cmd/termbridge
        env:
          GOOS: linux
          GOARCH: amd64
      - cmd: go build -trimpath -o {{.MACOS_ROOT}}/termbridge ./cmd/termbridge
        env:
          GOOS: darwin
          GOARCH: amd64
      - cp -R web/dist/. {{.WINDOWS_ROOT}}/web/
      - cp -R web/dist/. {{.LINUX_ROOT}}/web/
      - cp -R web/dist/. {{.MACOS_ROOT}}/web/
      - cp configs/config.yaml {{.WINDOWS_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.LINUX_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.MACOS_ROOT}}/configs/config.yaml
      - cp scripts/package/.env.preflite {{.WINDOWS_ROOT}}/
      - cp scripts/package/.env.preflite {{.LINUX_ROOT}}/
      - cp scripts/package/.env.preflite {{.MACOS_ROOT}}/
      - cp VERSION {{.WINDOWS_ROOT}}/
      - cp VERSION {{.LINUX_ROOT}}/
      - cp VERSION {{.MACOS_ROOT}}/
      - cp scripts/package/termbridge.cmd {{.WINDOWS_ROOT}}/termbridge.cmd
      - cp scripts/package/termbridge.sh {{.WINDOWS_ROOT}}/termbridge.sh
      - cp scripts/package/termbridge.sh {{.LINUX_ROOT}}/termbridge.sh
      - cp scripts/package/termbridge.sh {{.MACOS_ROOT}}/termbridge.sh
      - chmod +x {{.LINUX_ROOT}}/termbridge {{.LINUX_ROOT}}/termbridge.sh {{.MACOS_ROOT}}/termbridge {{.MACOS_ROOT}}/termbridge.sh
      - cd dist/package && zip -r ../termbridge-v{{.VERSION}}-windows-x64.zip termbridge-v{{.VERSION}}-windows-x64
      - cd dist/package && zip -r ../termbridge-v{{.VERSION}}-linux-x64.zip termbridge-v{{.VERSION}}-linux-x64
      - cd dist/package && zip -r ../termbridge-v{{.VERSION}}-macos-x64.zip termbridge-v{{.VERSION}}-macos-x64

  clean:
    desc: Remove build outputs and local development data
    cmds:
      - rm -rf web/dist bin dist
      - rm -rf data/agent.db*
      - rm -rf data/cloud.db*
      - rm -rf data/history
