syntax = "proto3";

package termbridge.common.v1;

import "google/protobuf/struct.proto";

option go_package = "termbridge-go/internal/gen/proto/termbridge/common/v1;commonv1";

message ErrorResp {
  string code = 1;
  string error = 2;
  string request_id = 3;
  google.protobuf.Struct details = 4;
}

message HealthResp {
  string status = 1;
}
