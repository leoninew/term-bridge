syntax = "proto3";

package termbridge.agent;

option go_package = "gitee.com/leoninew/TermBridge-go/internal/gen/proto/termbridge/agent/v1/file";

// Wire contract aligned with vscode.FileSystemProvider / FileStat / FileType.
// See: https://code.visualstudio.com/api/references/vscode-api#FileSystemProvider

enum FileType {
  FILE_TYPE_UNKNOWN = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMBOLIC_LINK = 64;
}

enum FilePermission {
  FILE_PERMISSION_UNSPECIFIED = 0;
  FILE_PERMISSION_READONLY = 1;
}

message FileStat {
  FileType type = 1;
  // Creation time in milliseconds since Unix epoch (vscode FileStat.ctime).
  int64 ctime = 2;
  // Modification time in milliseconds since Unix epoch (vscode FileStat.mtime).
  int64 mtime = 3;
  int64 size = 4;
  FilePermission permissions = 5;
  // Opaque concurrency token (etag); empty means unknown.
  string etag = 6;
}

message FsStatReq {
  string workspace_id = 1;
  string path = 2;
}

message FsStatResp {
  FileStat stat = 1;
}

message FsReadDirectoryReq {
  string workspace_id = 1;
  string path = 2;
}

message FsDirectoryEntry {
  string name = 1;
  FileType type = 2;
}

message FsReadDirectoryResp {
  repeated FsDirectoryEntry entries = 1;
  bool truncated = 2;
}

message FsReadFileReq {
  string workspace_id = 1;
  string path = 2;
}

message FsReadFileResp {
  bytes content = 1;
  FileStat stat = 2;
}

message FsWriteFileReq {
  string workspace_id = 1;
  string path = 2;
  bytes content = 3;
  bool create = 4;
  bool overwrite = 5;
  // When non-empty, write fails unless current etag matches (FileSystemError.FileExists / conflict).
  string etag = 6;
}

message FsWriteFileResp {
  FileStat stat = 1;
}

message FsCreateDirectoryReq {
  string workspace_id = 1;
  string path = 2;
}

message FsCreateDirectoryResp {
  FileStat stat = 1;
}

message FsDeleteReq {
  string workspace_id = 1;
  string path = 2;
  bool recursive = 3;
  bool use_trash = 4;
}

message FsDeleteResp {}

message FsRenameReq {
  string workspace_id = 1;
  string old_path = 2;
  string new_path = 3;
  bool overwrite = 4;
}

message FsRenameResp {
  FileStat stat = 1;
}
