syntax = "proto3";

package termbridge.agent;

import "google/protobuf/timestamp.proto";

option go_package = "gitee.com/leoninew/TermBridge-go/internal/gen/proto/termbridge/agent/v1/file";

enum FileEntryKind {
  FILE_ENTRY_KIND_UNSPECIFIED = 0;
  FILE_ENTRY_KIND_FILE = 1;
  FILE_ENTRY_KIND_DIRECTORY = 2;
}

message FileEntry {
  string path = 1;
  string name = 2;
  FileEntryKind kind = 3;
  int64 size = 4;
  google.protobuf.Timestamp modified_at = 5;
  string revision = 6;
  optional bool has_children = 7;
}

message RevisionPrecondition {
  string path = 1;
  string expected_revision = 2;
}

message FileConflict {
  string type = 1;
  FileEntry current_entry = 2;
}

message FileMutationResult {
  FileEntry source_entry = 1;
  FileEntry destination_entry = 2;
  int32 affected_count = 3;
  repeated string affected_path_prefixes = 4;
}

message ListFilesReq {
  string workspace_id = 1;
  string path = 2;
}

message ListFilesResp {
  FileEntry directory = 1;
  repeated FileEntry items = 2;
  bool truncated = 3;
}

message ReadFileReq {
  string workspace_id = 1;
  string path = 2;
}

message ReadFileResp {
  FileEntry entry = 1;
  string text = 2;
}

message CreateFileReq {
  string workspace_id = 1;
  string path = 2;
  string text = 3;
  bool overwrite = 4;
  string expected_parent_revision = 5;
  string expected_destination_revision = 6;
}

message CreateFileResp {
  FileMutationResult result = 1;
}

message CreateDirectoryReq {
  string workspace_id = 1;
  string path = 2;
  bool allow_existing = 3;
  string expected_parent_revision = 4;
}

message CreateDirectoryResp {
  FileMutationResult result = 1;
}

message WriteFileReq {
  string workspace_id = 1;
  string path = 2;
  string text = 3;
  string expected_revision = 4;
  bool force = 5;
}

message WriteFileResp {
  FileMutationResult result = 1;
}

message RenameEntryReq {
  string workspace_id = 1;
  string path = 2;
  string new_name = 3;
  string expected_source_revision = 4;
  string expected_parent_revision = 5;
  string expected_destination_revision = 6;
}

message RenameEntryResp {
  FileMutationResult result = 1;
}

message MoveEntryReq {
  string workspace_id = 1;
  string source_path = 2;
  string destination_path = 3;
  string expected_source_revision = 4;
  string expected_source_parent_revision = 5;
  string expected_destination_parent_revision = 6;
  string expected_destination_revision = 7;
}

message MoveEntryResp {
  FileMutationResult result = 1;
}

message DeleteEntryReq {
  string workspace_id = 1;
  string path = 2;
  string expected_revision = 3;
  string expected_parent_revision = 4;
  bool recursive = 5;
}

message DeleteEntryResp {
  FileMutationResult result = 1;
}
