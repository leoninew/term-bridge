syntax = "proto3";

package termbridge.agent;

option go_package = "gitee.com/leoninew/TermBridge-go/internal/gen/proto/termbridge/agent/v1/history";

message ReadHistoryReq {}

message ReadWorkspaceSessionHistoryReq {
  string workspace_id = 1;
  string session_id = 2;
}

message ReadHistoryResp {
  string text = 1;
}
