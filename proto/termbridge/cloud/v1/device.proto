syntax = "proto3";

package termbridge.cloud;

import "google/protobuf/timestamp.proto";

option go_package = "gitee.com/leoninew/TermBridge-go/internal/gen/proto/termbridge/cloud/v1/device";

message DeviceSummary {
  string id = 1;
  string name = 2;
  bool online = 3;
  string status = 4;
  google.protobuf.Timestamp connected_at = 5;
  google.protobuf.Timestamp last_seen = 6;
}

message ListDevicesResp {
  repeated DeviceSummary items = 1;
}

message CurrentDeviceReq {
  string id = 1;
  string name = 2;
  string public_key = 3;
}

message CurrentDeviceResp {
  bool accepted = 1;
  DeviceSummary device = 2;
}
