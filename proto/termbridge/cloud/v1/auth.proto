syntax = "proto3";

package termbridge.cloud;

import "termbridge/cloud/v1/device.proto";
import "termbridge/cloud/v1/session.proto";

option go_package = "gitee.com/leoninew/TermBridge-go/internal/gen/proto/termbridge/cloud/v1/auth";

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  bool email_verified = 4;
  string provider = 5;
}

message AuthLoginReq {
  string email = 1;
  string username = 2;
  string password = 3;
  string turnstile_token = 4;
  string csrf_token = 5;
}

message AuthRegisterReq {
  string email = 1;
  string password = 2;
  string turnstile_token = 3;
}

message AuthSecurityConfigResp {
  string turnstile_site_key = 1;
}

message AuthCsrfTokenResp {
  string token = 1;
}

message AuthVerifyEmailReq {
  string email = 1;
  string code = 2;
}

message AuthResendVerificationReq {
  string email = 1;
}

message AuthChangePasswordReq {
  string current_password = 1;
  string new_password = 2;
}

message AuthPasswordResetRequestReq {
  string email = 1;
}

message AuthPasswordResetConfirmReq {
  string email = 1;
  string code = 2;
  string new_password = 3;
}

message AuthExternalCallbackReq {
  string code = 1;
  string state = 2;
}

message CloudOAuthExchangeReq {
  string code = 1;
}

message CloudOAuthExchangeResp {
  string access_token = 1;
  string token_type = 2;
}

message AuthLoginResp {
  string access_token = 1;
  string token_type = 2;
}

message AuthExternalCallbackResp {
  string access_token = 1;
  string token_type = 2;
}

message CloudOAuthTokenResp {
  string access_token = 1;
  string token_type = 2;
}

message ExternalAuthUrlResp {
  string auth_url = 1;
}

message AuthMeResp {
  bool authenticated = 1;
  User user = 2;
  CloudSessionSummary cloud_session = 3;
  DeviceSummary device = 4;
}
