syntax = "proto3";

package termbridge.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "termbridge-go/internal/shared/dto/proto/termbridge/cloud/v1;cloudv1";

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  bool email_verified = 4;
}

message DeviceSummary {
  string id = 1;
  string name = 2;
  bool online = 3;
  string status = 4;
  google.protobuf.Timestamp connected_at = 5;
  google.protobuf.Timestamp last_seen = 6;
}

message CloudSessionSummary {
  string gate_url = 1;
  string device_id = 2;
  string device_name = 3;
  google.protobuf.Timestamp connected_at = 4;
}

message AuthLoginReq {
  string email = 1;
  string username = 2;
  string password = 3;
}

message TokenResp {
  string access_token = 1;
  string token_type = 2;
}

message AuthMeResp {
  bool authenticated = 1;
  string username = 2;
  User user = 3;
  CloudSessionSummary cloud_session = 4;
}

message ListDevicesResp {
  repeated DeviceSummary items = 1;
}

message CurrentDeviceReq {
  string id = 1;
  string name = 2;
  string public_key = 3;
}

message CurrentDeviceResp {
  bool accepted = 1;
  DeviceSummary device = 2;
}

message CloudOAuthStartResp {
  string authorize_url = 1;
}

message CloudOAuthAuthorizeResp {
  string redirect_url = 1;
}

message CloudOAuthExchangeReq {
  string code = 1;
}

message CloudOAuthCallbackReq {
  string code = 1;
  string state = 2;
}

message CloudOAuthCallbackResp {
  CloudSessionSummary cloud_session = 1;
  string redirect = 2;
}
