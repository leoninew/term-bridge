syntax = "proto3";

package termbridge.tunnel.v1;

import "termbridge/common/v1/common.proto";
import "termbridge/runtime/v1/runtime.proto";

option go_package = "termbridge-go/internal/shared/dto/proto/termbridge/tunnel/v1;tunnelv1";

message TunnelFrame {
  string stream_id = 1;
  string request_id = 2;

  oneof payload {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Ping ping = 12;
    Pong pong = 13;

    termbridge.runtime.v1.ListWorkspacesReq list_workspaces_req = 100;
    termbridge.runtime.v1.WorkspaceTreeReq workspace_tree_req = 101;
    termbridge.runtime.v1.WorkspaceSessionsReq workspace_sessions_req = 102;
    termbridge.runtime.v1.CreateSessionReq create_session_req = 103;
    termbridge.runtime.v1.WorkspaceSessionReq get_session_req = 104;
    termbridge.runtime.v1.RerunSessionReq rerun_session_req = 105;
    termbridge.runtime.v1.UpdateSessionReq update_session_req = 106;
    termbridge.runtime.v1.WorkspaceSessionReq close_session_req = 107;
    termbridge.runtime.v1.WorkspaceSessionReq delete_session_req = 108;
    termbridge.runtime.v1.ReadHistoryReq read_history_req = 109;
    termbridge.runtime.v1.UpdateWorkspaceOrderReq update_workspace_order_req = 110;
    termbridge.runtime.v1.UpdateSessionOrderReq update_session_order_req = 111;
    termbridge.runtime.v1.DeleteWorkspaceReq delete_workspace_req = 112;

    termbridge.runtime.v1.ListWorkspacesResp list_workspaces_resp = 200;
    termbridge.runtime.v1.WorkspaceTreeResp workspace_tree_resp = 201;
    termbridge.runtime.v1.WorkspaceSessionsResp workspace_sessions_resp = 202;
    termbridge.runtime.v1.CreateSessionResp create_session_resp = 203;
    termbridge.runtime.v1.GetSessionResp get_session_resp = 204;
    termbridge.runtime.v1.CreateSessionResp rerun_session_resp = 205;
    termbridge.runtime.v1.UpdateSessionResp update_session_resp = 206;
    termbridge.runtime.v1.CloseSessionResp close_session_resp = 207;
    termbridge.runtime.v1.DeleteSessionResp delete_session_resp = 208;
    termbridge.runtime.v1.ReadHistoryResp read_history_resp = 209;
    termbridge.runtime.v1.UpdateWorkspaceOrderResp update_workspace_order_resp = 210;
    termbridge.runtime.v1.UpdateSessionOrderResp update_session_order_resp = 211;
    termbridge.runtime.v1.DeleteWorkspaceResp delete_workspace_resp = 212;

    TerminalAttachReq terminal_attach = 300;
    TerminalInput terminal_input = 301;
    TerminalOutput terminal_output = 302;
    TerminalResize terminal_resize = 303;
    TerminalClosed terminal_closed = 304;

    termbridge.common.v1.ErrorResp error = 900;
    Close close = 901;
  }
}

message Hello {
  string device_id = 1;
  string device_name = 2;
  int32 protocol_version = 3;
}

message HelloAck {
  int32 protocol_version = 1;
}

message Ping {
  string nonce = 1;
}

message Pong {
  string nonce = 1;
}

message TerminalAttachReq {
  string workspace_id = 1;
  string session_id = 2;
  int32 cols = 3;
  int32 rows = 4;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalOutput {
  bytes data = 1;
}

message TerminalResize {
  int32 cols = 1;
  int32 rows = 2;
}

message TerminalClosed {
  string reason = 1;
}

message Close {
  string reason = 1;
}
