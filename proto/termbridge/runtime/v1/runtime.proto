syntax = "proto3";

package termbridge.runtime.v1;

import "google/protobuf/timestamp.proto";

option go_package = "termbridge-go/internal/shared/dto/proto/termbridge/runtime/v1;runtimev1";

message Workspace {
  string id = 1;
  string name = 2;
  string path = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message WorkspaceTreeNode {
  string id = 1;
  string name = 2;
  string path = 3;
  google.protobuf.Timestamp updated_at = 4;
  repeated SessionSummary children = 5;
}

message SessionSummary {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  string command = 4;
  string cwd = 5;
  string lifecycle_state = 6;
  string attachment_state = 7;
  optional int32 exit_code = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListWorkspacesReq {}

message ListWorkspacesResp {
  repeated Workspace items = 1;
}

message WorkspaceTreeReq {}

message WorkspaceTreeResp {
  repeated WorkspaceTreeNode items = 1;
}

message UpdateWorkspaceOrderReq {
  repeated string workspace_ids = 1;
}

message UpdateWorkspaceOrderResp {
  repeated Workspace items = 1;
}

message DeleteWorkspaceReq {
  string workspace_id = 1;
}

message DeleteWorkspaceResp {}

message CreateSessionReq {
  string workspace_id = 1;
  string name = 2;
  string cwd = 3;
  repeated string command = 4;
  int32 cols = 5;
  int32 rows = 6;
}

message CreateSessionResp {
  string session_id = 1;
  string workspace_id = 2;
  string state = 3;
}

message WorkspaceSessionsReq {
  string workspace_id = 1;
}

message WorkspaceSessionsResp {
  repeated SessionSummary items = 1;
}

message WorkspaceSessionReq {
  string workspace_id = 1;
  string session_id = 2;
}

message GetSessionResp {
  SessionSummary session = 1;
}

message RerunSessionReq {
  int32 cols = 1;
  int32 rows = 2;
}

message RerunWorkspaceSessionReq {
  string workspace_id = 1;
  string session_id = 2;
  RerunSessionReq request = 3;
}

message UpdateSessionReq {
  optional string name = 1;
}

message UpdateWorkspaceSessionReq {
  string workspace_id = 1;
  string session_id = 2;
  UpdateSessionReq request = 3;
}

message UpdateSessionResp {
  SessionSummary session = 1;
}

message DeleteSessionResp {}

message CloseSessionResp {
  SessionSummary session = 1;
}

message UpdateSessionOrderReq {
  repeated string session_ids = 1;
}

message WorkspaceSessionOrderReq {
  string workspace_id = 1;
  repeated string session_ids = 2;
}

message UpdateSessionOrderResp {
  repeated SessionSummary items = 1;
}

message ReadHistoryReq {}

message ReadWorkspaceSessionHistoryReq {
  string workspace_id = 1;
  string session_id = 2;
}

message ReadHistoryResp {
  string text = 1;
}
