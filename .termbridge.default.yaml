log:
  level: info
  format: text
  dir: logs
  request_body_limit: 4096
  response_body_limit: 4096

history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

runtime:
  state_dir: .termbridge

web:
  allowed_origins:
    - http://localhost:9011
  env:
    denylist: []
  error:
    debug: false

serve:
  host: 127.0.0.1
  port: 9010
  open: false
  dev: false

agent:
  server_url: http://127.0.0.1:9010
  device_name: local-dev
