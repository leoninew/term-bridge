# TermBridge-go 默认配置
#
# 复制为 .termbridge.yaml 或使用 .env / 环境变量覆盖。
# 配置优先级：.termbridge.default.yaml < .termbridge.yaml < .env < OS env。

# JWT 认证密钥（必填）
# 生成方式：openssl rand -base64 32
jwt:
  secret_key: ""

# 日志
log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096

# 历史记录
history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

# Runtime 状态目录
runtime:
  state_dir: .termbridge

# Gate
gate:
  listen_url: http://127.0.0.1:9010
  browser:
    allowed_origins:
      - http://localhost:9011
  api:
    expose_errors: false

# Agent
agent:
  connect_url: ""
  device_id: ""
  device_name: ""
