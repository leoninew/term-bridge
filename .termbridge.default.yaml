log:
  level: info
  format: text
  dir: logs
  http:
    request_body_limit: 4096
    response_body_limit: 4096

history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

runtime:
  state_dir: .termbridge

gate:
  listen_url: http://127.0.0.1:9010
  browser:
    allowed_origins:
      - http://localhost:9011
  api:
    expose_errors: false

agent:
  connect_url: ""
  device_id: ""
  device_name: ""
