log:
  level: info
  format: text
  dir: logs
  request_body_limit: 4096
  response_body_limit: 4096

history:
  max_lines: 10000
  max_bytes: 5242880
  max_line_bytes: 65536

runtime:
  state_dir: .termbridge

web:
  allowed_origins:
    - http://localhost:9011
  cwd_allowlist:
    - /Users/leon
  env:
    denylist: []
  error:
    debug: false
